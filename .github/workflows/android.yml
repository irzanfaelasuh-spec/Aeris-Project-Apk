
name: AERIS Android CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeris-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AERIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Check Gradle version
        run: ./gradlew --version

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Kotlin compiler diagnostics
        run: |
          ./gradlew :app:compileDebugKotlin :app:compileReleaseKotlin \
            --continue \
            --stacktrace \
            --info \
            --warning-mode all

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      - name: Upload AERIS APK
        uses: actions/upload-artifact@v4
        with:
          name: AERIS-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
